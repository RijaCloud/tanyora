name: tanyora-local
services:
  database:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: tanyora_local
      MARIADB_USER: tanyora
      MARIADB_PASSWORD: ${TANYORA_DB_PASSWORD:?Set TANYORA_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${TANYORA_DB_ROOT_PASSWORD:?Set TANYORA_DB_ROOT_PASSWORD}
    volumes:
      - tanyora_db:/var/lib/mysql
    networks: [internal]
    ports: ["127.0.0.1:3308:3306"]
  wordpress:
    image: wordpress:7.1.3-php8.2-apache
    restart: unless-stopped
    depends_on: [database]
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: tanyora_local
      WORDPRESS_DB_USER: tanyora
      WORDPRESS_DB_PASSWORD: ${TANYORA_DB_PASSWORD:?Set TANYORA_DB_PASSWORD}
    volumes:
      - tanyora_wp:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/tanyora:ro
    networks: [internal]
    ports: ["127.0.0.1:8088:80"]
networks:
  internal:
    internal: true
volumes:
  tanyora_db:
  tanyora_wp:
